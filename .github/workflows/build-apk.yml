name: Build Android APK & Deploy Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Prepare Android assets & Gradle properties
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo '{"appId":"com.torqmax.app","appName":"TorqMax","webDir":"dist"}' > android/app/src/main/assets/capacitor.config.json
          echo '' > android/app/src/main/assets/capacitor.plugins.json
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -80

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorqMax-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: TorqMax Android App — Latest Build
          body: |
            ## Download TorqMax for Android

            Tap **TorqMax-Android.apk** below to download and install the TorqMax Auto Accessories app.

            ### How to install
            1. Download the APK file
            2. On your Android phone: **Settings → Security → Install unknown apps** → allow your browser
            3. Open the downloaded file and tap **Install**

            ### What's inside
            - 103+ car models (Hatchback, Sedan, SUV, Luxury)
            - Checkmate & Exotic mat styles
            - Black & Beige colour options
            - Live 3D mat preview
            - 1-tap WhatsApp ordering
            - Works offline
          files: android/app/build/outputs/apk/debug/app-debug.apk
          asset_name: TorqMax-Android.apk
          make_latest: true

  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
