name: Build Android APK & Deploy Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Prepare Android assets & Gradle properties
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          mkdir -p android/app/src/main/assets
          echo "{}" > android/app/src/main/assets/capacitor.plugins.json
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -80

      - name: Locate and Prepare APK
        run: |
          echo "Searching for built APKs..."
          find android -type f -name "*.apk"
          APK_FILE=$(find android -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at $APK_FILE"
            cp "$APK_FILE" TorqMax-Android.apk
            ls -lh TorqMax-Android.apk
          else
            echo "Error: No APK file found in android directory!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorqMax-Android-APK
          path: TorqMax-Android.apk

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: android-latest
          name: TorqMax Android App — Latest Build
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 📱 Download TorqMax for Android

            Direct download: **[TorqMax-Android.apk](https://github.com/shivamprajapati7077/torqmaxapp/releases/download/android-latest/TorqMax-Android.apk)**

            ### How to install:
            1. Download the APK file.
            2. On your Android phone: go to **Settings → Security → Install unknown apps** and enable permission for your browser.
            3. Open the downloaded file and tap **Install**.

            ### App Features:
            - 103+ car models (Hatchback, Sedan, SUV, Luxury)
            - Checkmate & Exotic mat styles
            - Black & Beige colour options
            - Real-time 3D mat customization preview
            - 1-tap WhatsApp order dispatch
            - Works offline
          files: TorqMax-Android.apk
          make_latest: true

  deploy-web:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: TorqMax-Android-APK
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
