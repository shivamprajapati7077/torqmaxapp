name: Build Android APK & Deploy Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 36 and build-tools 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Prepare Android assets & Gradle properties
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          find android/app/src/main/assets/public -name "*.apk" -delete
          echo '{"appId":"com.torqmax.app","appName":"TorqMax","webDir":"dist"}' > android/app/src/main/assets/capacitor.config.json
          echo '' > android/app/src/main/assets/capacitor.plugins.json
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -100

      - name: Embed APK into Web Dist & Root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./dist/TorqMax-Android.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./dist/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./TorqMax-Android.apk
          ls -lh ./dist/TorqMax-Android.apk ./TorqMax-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorqMax-Android-APK
          path: ./TorqMax-Android.apk

      - name: Deploy Web App & APK to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-latest
          name: "TorqMax Android App v1.2"
          body: "Official latest build of TorqMax Android App with Customer Authentication & Owner Console.\n\n- Customer Google Authentication before WhatsApp dispatch\n- In-app customer order history and real-time status tracking\n- Owner Console with customer parties list, live dispatch statuses & print slips"
          files: |
            ./TorqMax-Android.apk
            ./dist/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

